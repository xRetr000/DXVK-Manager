name: Release

on:
  push:
    tags: ["v*"]
  # Also allow building from the Actions tab without tagging, for test builds
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload the .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # A release built with a stale APP_VERSION would tell every user who
      # downloads it that an update is available — for the version they have.
      - name: Check tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from constants import APP_VERSION
          from update_checker import is_newer
          tag = os.environ["GITHUB_REF_NAME"]
          if is_newer(tag, APP_VERSION) or is_newer(APP_VERSION, tag):
              sys.exit(f"Tag {tag} does not match APP_VERSION {APP_VERSION} in constants.py "
                       f"- bump APP_VERSION and pyproject.toml, then re-tag.")
          print(f"Tag {tag} matches APP_VERSION {APP_VERSION}")

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          pytest tests/ -q

      - name: Build executable
        run: python build_executable.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DXVK_Manager
          path: dist/DXVK_Manager.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DXVK_Manager.exe
          generate_release_notes: true
