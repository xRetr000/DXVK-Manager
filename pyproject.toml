[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dxvk-manager"
version = "0.7.0"
description = "A Windows tool for automatically installing and managing DXVK files for games"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "xRetr000", email = "xretrocs@gmail.com"}
]
keywords = ["dxvk", "gaming", "vulkan", "directx", "wine", "linux", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pefile>=2023.2.7",
    "requests>=2.31.0",
    "PyQt6>=6.6.0",
    "zstandard>=0.22.0",
]



[project.scripts]
dxvk-manager = "dxvk_manager:main"

[project.urls]
Homepage = "https://github.com/xRetr000/DXVK-Manager"
Documentation = "https://github.com/xRetr000/DXVK-Manager#readme"
Repository = "https://github.com/xRetr000/DXVK-Manager"
Issues = "https://github.com/xRetr000/DXVK-Manager/issues"

